spring.application.name=library

# Conexión a MySQL: se lee de variables de entorno; los valores tras ':' son los de por defecto
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate solo valida que las entidades coinciden con las tablas; no las crea ni modifica
spring.jpa.hibernate.ddl-auto=validate

# Sin sesión de BD abierta durante la vista: las relaciones se cargan dentro del Service
spring.jpa.open-in-view=false

# JWT: en producción la clave debe venir de la variable JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-no-usar}
jwt.expiration-ms=86400000