# Perfil docker: H2 en memoria en lugar de MySQL; el esquema lo crea Hibernate y db/init.sql no se usa
spring.datasource.url=jdbc:h2:mem:library;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop